apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: expense-tracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Edwin-Oghenetejiri1/expense-tracker-k8s-manifests.git
    targetRevision: HEAD
    path: Kubernetes-Manifests-file
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: expense-tracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
